set -g default-shell /usr/bin/zsh

set -g history-limit 100000

set -g mouse off

set -g renumber-windows on

set -g status-interval 1

# Key bindings
bind -n F2 new-window
bind -n F3 previous-window
bind -n F4 next-window
bind -n M-PageUp copy-mode -u

# Status bar
set -g status-style "bg=#0b0f17,fg=#8b949e"
set -g status-left "⛩️  #S "
set -g status-right " #[fg=yellow]#(cat /proc/loadavg | awk '{print $1}') #[fg=green]#(free -b | awk '/^Mem:/ { printf \"%.0f%%\\n\", 100 * \$3 / \$2 }') #[fg=purple]#(df -P / | awk 'END {print \$5}') #[fg=white]#(awk '{printf \"%%d:%%02d\", int($1/3600), int(($1%3600)/60)}' /proc/uptime) #[fg=default]#{user}@#{host_short} %Y-%m-%d %H:%M:%S"
set -g status-right-length 50
setw -g window-status-format " #I:#W#F "
setw -g window-status-current-format " #I:#W#F "
setw -g window-status-current-style "bg=#0b0f17,fg=#3fe081,bold"
setw -g window-status-separator ""

# Ghostty
set -g default-terminal "tmux-256color"